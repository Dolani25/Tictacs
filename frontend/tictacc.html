            const PI = Math.PI;
            
            class Circle {
    constructor() {
        this.posX = Math.floor(Math.random() * cw);
        this.posY = Math.floor(Math.random() * ch);
        this.vx = -1;
        this.vy = Math.floor(Math.random() * 2 + 1);
        this.r = Math.random() * 15 + 10;
        this.color = "blue";
    }

    draw() {
        ctx.strokeStyle = this.color;  // Use the instance's color
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.posX, this.posY, this.r, 0, Math.PI * 2);
        ctx.stroke();
    }

    move() {
        this.posX += this.vx;
        this.posY += this.vy;
        this.checkCollision();
    }

    checkCollision() {
        if (this.posX < 0 || this.posX > cw) {
            this.vx = -this.vx;
            this.changeColor();
        }
        if (this.posY < 0 || this.posY > ch) {
            this.vy = -this.vy;
            this.changeColor();
        }
    }

    changeColor() {
        this.color = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }
}
            
            
            
            class Triangle {
    constructor() {
        this.posX = Math.floor(Math.random() * cw);
        this.posY = Math.floor(Math.random() * ch);
        this.vx = -1;
        this.vy = Math.floor(Math.random() * 2 + 1);
        this.w = this.h = Math.random() * 30 + 10;
        this.color = "blue";
    }
    
    draw() {
        ctx.strokeStyle = this.color;  // Use strokeStyle instead of fillStyle
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.posX, this.posY);
        ctx.lineTo(this.posX + this.w / 2, this.posY + this.h);
        ctx.lineTo(this.posX - this.w / 2, this.posY + this.h);
        ctx.closePath();
        ctx.stroke();
    }
    
    move() {
        this.posX += this.vx;
        this.posY += this.vy;
        this.checkCollision();
    }

    checkCollision() {
        if (this.posX < this.w / 2 || this.posX > cw - this.w / 2) {
            this.vx = -this.vx;
            this.changeColor();
        }
        if (this.posY < 0 || this.posY > ch - this.h) {
            this.vy = -this.vy;
            this.changeColor();
        }
    }
    
    changeColor() {
        this.color = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }
}

            //new Shapes
            class Cross {
    constructor() {
        this.posX = Math.floor(Math.random() * cw);
        this.posY = Math.floor(Math.random() * ch);
        this.vx = -1;
        this.vy = Math.floor(Math.random() * 2 + 1);
        this.size = Math.random() * 15 + 10;
        this.color = "red";
    }

    draw() {
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.posX - this.size, this.posY);
        ctx.lineTo(this.posX + this.size, this.posY);
        ctx.moveTo(this.posX, this.posY - this.size);
        ctx.lineTo(this.posX, this.posY + this.size);
        ctx.stroke();
    }

    move() {
        this.posX += this.vx;
        this.posY += this.vy;
        this.checkCollision();
    }

    checkCollision() {
        if (this.posX < this.size || this.posX > cw - this.size) {
            this.vx = -this.vx;
            this.changeColor();
        }
        if (this.posY < this.size || this.posY > ch - this.size) {
            this.vy = -this.vy;
            this.changeColor();
        }
    }

    changeColor() {
        this.color = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }
}

class Star {
    constructor() {
        this.posX = Math.floor(Math.random() * cw);
        this.posY = Math.floor(Math.random() * ch);
        this.vx = -1;
        this.vy = Math.floor(Math.random() * 2 + 1);
        this.outerRadius = Math.random() * 15 + 10;
        this.innerRadius = this.outerRadius / 2;
        this.spikes = 5;
        this.color = "yellow";
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.posX, this.posY - this.outerRadius);

        for (let i = 0; i < this.spikes * 2; i++) {
            let radius = i % 2 === 0 ? this.outerRadius : this.innerRadius;
            let angle = (Math.PI * i) / this.spikes;
            let x = this.posX + Math.cos(angle) * radius;
            let y = this.posY + Math.sin(angle) * radius;
            ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    move() {
        this.posX += this.vx;
        this.posY += this.vy;
        this.checkCollision();
    }

    checkCollision() {
        if (this.posX < this.outerRadius || this.posX > cw - this.outerRadius) {
            this.vx = -this.vx;
            this.changeColor();
        }
        if (this.posY < this.outerRadius || this.posY > ch - this.outerRadius) {
            this.vy = -this.vy;
            this.changeColor();
        }
    }

    changeColor() {
        this.color = '#' + Math.floor(Math.random() * 16777215).toString(16);
    }
}

    }

// Reset Game Board
function resetGameBoard() {
    const uses = gameBoard.querySelectorAll('use');
    uses.forEach(use => use.remove());
    
    for (let i = 0; i < 9; i++) {
        const x = (i % 3) * 66.67;
        const y = Math.floor(i / 3) * 66.67;
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", x);
        rect.setAttribute("y", y);
        rect.setAttribute("width", "66.66");
        rect.setAttribute("height", "66.66");
        rect.setAttribute("fill", "transparent");
        rect.dataset.index = i;
        rect.addEventListener('click', () => makeMove(i));
        gameBoard.appendChild(rect);
    }

    // Hide the winner line
    const winnerLine = gameBoard.querySelector('line[id="winLine"]');
    winnerLine.style.display = 'none';
}

function makeMove(position) {
    if (currentGameId) {
        socket.emit('make_move', {

    }
}

// Handle Move Made
function handleMoveMade(data) {
    const x = (data.position % 3) * 66.67;
    const y = Math.floor(data.position / 3) * 66.67;
    const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", data.player === currentPlayer ? "#x-symb" : "#o-symb");
    use.setAttribute("x", x);
    use.setAttribute("y", y);
    gameBoard.appendChild(use);
}

// Show Winner Line

function showWinnerLine(winningCombination) {
    const winnerLine = gameBoard.querySelector('line[id="winLine"]');
    const startCell = winningCombination[0];
    const endCell = winningCombination[2];
    
    const cellSize = 66.67;
    const boardSize = cellSize * 3;
    
    let startX, startY, endX, endY;
    
    // Determine if it's a row, column, or diagonal win
    if (Math.floor(startCell / 3) === Math.floor(endCell / 3)) {
        // Row win
        startX = -cellSize * 0.1;
        endX = boardSize + cellSize * 0.1;
        startY = endY = (Math.floor(startCell / 3) + 0.5) * cellSize;
    } else if (startCell % 3 === endCell % 3) {
        // Column win
        startX = endX = ((startCell % 3) + 0.5) * cellSize;
        startY = -cellSize * 0.1;
        endY = boardSize + cellSize * 0.1;
    } else {
        // Diagonal win
        if (startCell === 0) {
            // Top-left to bottom-right diagonal
            startX = startY = -cellSize * 0.1;
            endX = endY = boardSize + cellSize * 0.1;
        } else {
            // Top-right to bottom-left diagonal
            startX = boardSize + cellSize * 0.1;
            startY = -cellSize * 0.1;
            endX = -cellSize * 0.1;
            endY = boardSize + cellSize * 0.1;
        }
    }
    
    winnerLine.setAttribute('x1', startX);
    winnerLine.setAttribute('y1', startY);
    winnerLine.setAttribute('x2', endX);
    winnerLine.setAttribute('y2', endY);
    
    winnerLine.style.display = 'block';
    winnerLine.querySelector('animate').beginElement();
}

    }
}
